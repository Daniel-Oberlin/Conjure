[project]
name = "conjure"
version = "0.0.1"
description = "Conjure — a voice-driven WebXR holodeck (Phase 0 scaffold)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "mcp>=1.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "trimesh>=4.0",
    "google-genai>=1.0",
    "openai>=1.40",
    "pillow>=10.0",
    "sqlite-vec>=0.1.6",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
# Phase 2 voice loop. Local STT (Whisper) + local TTS (Kokoro) + cloud director (Claude).
# Some of these pull large deps (torch etc.) and need system libs — see docs/setup.md.
voice = [
    "pipecat-ai[anthropic,whisper,kokoro,silero,local]>=1.3.0",
]
# Asset-library embeddings (docs/asset-library-plan.md §4). Local SigLIP via torch+transformers —
# heavy (multi-GB), so kept OUT of the core install. The server runs ML-free without it (catalog on
# FTS/exact); install this to enable semantic / image-similarity search. Use the CPU torch wheel on
# non-GPU hosts to avoid the CUDA download.
embed = [
    "torch>=2.2",
    "transformers>=4.45",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
conjure = "conjure.__main__:main"
conjure-agent = "conjure.agent_server:main"
conjure-mcp = "conjure.mcp_server:main"
conjure-doctor = "conjure.doctor:main"
conjure-voice = "conjure.voice:main"
conjure-cli = "conjure.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["conjure"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits real external APIs (opt-in; needs keys + network). Run with: pytest -m live",
]
# Default run skips live canaries (Tier 3).
addopts = "-m 'not live'"
