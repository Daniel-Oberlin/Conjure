[project]
name = "conjure"
version = "0.0.1"
description = "Conjure — a voice-driven WebXR holodeck (Phase 0 scaffold)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "mcp>=1.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "trimesh>=4.0",
    "google-genai>=1.0",
]

[project.optional-dependencies]
# Phase 2 voice loop. Local STT (Whisper) + local TTS (Kokoro) + cloud director (Claude).
# Some of these pull large deps (torch etc.) and need system libs — see docs/setup.md.
voice = [
    "pipecat-ai[anthropic,whisper,kokoro,silero,local]>=1.3.0",
]
dev = [
    "pytest>=8",
]

[project.scripts]
conjure = "conjure.__main__:main"
conjure-mcp = "conjure.mcp_server:main"
conjure-doctor = "conjure.doctor:main"
conjure-voice = "conjure.voice:main"
conjure-cli = "conjure.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["conjure"]
