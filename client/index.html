<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Conjure</title>
    <!-- A-Frame (declarative WebXR / ECS over three.js). CDN for dev; vendor locally later. -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body style="margin: 0">
    <!-- Client build badge (2D page only; hidden once in immersive AR/VR). The server stamps the build
         time from the JS file's mtime — the same value as the ?v= cache-bust — and conjure-client.js
         appends "✓" once it actually runs, so a stale/cached page is obvious at a glance. -->
    <div id="conjure-version" style="position:fixed;top:8px;right:10px;z-index:99999;font:12px/1.4
         monospace;color:#9fdcb0;background:rgba(0,0,0,.55);padding:4px 8px;border-radius:6px;">
      client __CLIENT_VERSION__
    </div>
    <a-scene background="color: #1a2233"
             room-capture
             controller-beams
             occlusion
             renderer="foveationLevel: 0"
             webxr="optionalFeatures: plane-detection, mesh-detection, hit-test, anchors, depth-sensing, hand-tracking, local-floor">
      <!-- foveationLevel: 0 disables fixed foveated rendering (A-Frame's default is 1 = MAX), which
           renders the periphery at reduced resolution → the fuzzy/moiré edge bands on fine geometry
           (grid, surface edges). 0 = full-res everywhere (more GPU — dial up to ~0.3 if frames drop).
           This is the STARTUP default; --foveation (window.CONJURE_FOVEATION) overrides it at runtime
           via renderer.xr.setFoveation() so you can A/B without an edit — see conjure-client.js tick. -->
      <a-sky id="sky" color="#1a2233"></a-sky>
      <!-- Opt-in ground-projected skybox (env.sky.grounded); idle until a grounded skybox is set. -->
      <a-entity id="grounded-sky" grounded-sky></a-entity>
      <a-entity light="type: ambient; intensity: 0.6"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="-1 3 2"></a-entity>

      <!-- Everything the world server sends lands under here. -->
      <a-entity id="world-root"></a-entity>

      <!-- Rig at the ORIGIN so the A-Frame world frame matches the headset's reference space:
           captured room geometry (poses relative to that reference space) then lines up around you
           instead of being offset. Eye height lives on the camera (used on desktop; the headset
           pose overrides it in VR/AR — putting it on the rig would double-count height). -->
      <a-entity id="rig" position="0 0 0">
        <a-camera position="0 1.6 0"></a-camera>
      </a-entity>
    </a-scene>

    <script src="/static/conjure-clock.js"></script>
    <!-- The single XR input reader + action bindings. Must load BEFORE any module that reads input
         (dynamic modules below, controller-beams) — see docs/specs/dynamics.md §6. -->
    <script src="/static/conjure-pointers.js"></script>
    <!-- __DYNAMIC_MODULES__ : the server injects a <script> per module scoped to the ACTIVE agent
         (docs/specs/dynamics.md §9), re-injected on agent switch. -->
    <script src="/static/world-model.js"></script>
    <script src="/static/occlusion.js"></script>
    <script src="/static/room-snap.js"></script>
    <script src="/static/plane-anchor.js"></script>
    <script src="/static/grounded-skybox.js"></script>
    <script src="/static/figure.js"></script>
    <script src="/static/controller-beams.js"></script>
    <!-- Debug-only surface overlay (--debug-surface-overlay): seed / device-rect / device-polygon
         wireframes drawn together in F_track. Inert unless the flag is on. -->
    <script src="/static/surface-overlay.js"></script>
    <script src="/static/conjure-client.js"></script>
  </body>
</html>
