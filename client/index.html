<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Conjure</title>
    <!-- A-Frame (declarative WebXR / ECS over three.js). CDN for dev; vendor locally later. -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body style="margin: 0">
    <a-scene background="color: #1a2233"
             room-capture
             webxr="optionalFeatures: plane-detection, mesh-detection, hit-test, anchors, depth-sensing, local-floor">
      <a-sky id="sky" color="#1a2233"></a-sky>
      <a-entity light="type: ambient; intensity: 0.6"></a-entity>
      <a-entity light="type: directional; intensity: 0.8" position="-1 3 2"></a-entity>

      <!-- Everything the world server sends lands under here. -->
      <a-entity id="world-root"></a-entity>

      <!-- Rig at floor level (y=0): in the headset WebXR adds your real head height, so the eye
           height belongs on the camera (used on desktop; overridden by the headset pose in VR).
           Putting 1.6 on the rig double-counts height in VR and floats you above a real-scale room. -->
      <a-entity id="rig" position="0 0 4">
        <a-camera position="0 1.6 0"></a-camera>
      </a-entity>
    </a-scene>

    <script src="/static/conjure-client.js"></script>
  </body>
</html>
